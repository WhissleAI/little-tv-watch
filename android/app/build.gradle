apply plugin: "com.android.application"

android {
    namespace "ai.whissle.tvwatch"
    compileSdk 36
    defaultConfig {
        applicationId "ai.whissle.tvwatch"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // a hackathon build: release (not debuggable), signed with the local debug key
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
